version: 1
id_pattern: 'SP-[0-9]+'
specs:
  - specs
tests:
  - cmd
  - internal
results:
  - build/test-results/*.xml
exclude:
  - '**/testdata/**'
  - '**/*.md'
  - '**/*.json'
test_commands:
  - go tool gotestsum --format pkgname --junitfile build/test-results/go.xml -- -count=1 -p 1 -tags grammar_subset,grammar_subset_python,grammar_subset_javascript,grammar_subset_typescript,grammar_subset_tsx,grammar_subset_java,grammar_subset_kotlin ./...
severities:
  tag_not_in_results: error
  bound_non_testable: error
