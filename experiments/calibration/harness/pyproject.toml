[project]
name = "calibration"
version = "0.1.0"
description = "Harness of the System One confidence calibration experiment (limit 4)"
requires-python = "==3.13.14"
dependencies = [
    "numpy",
    "pyyaml",
    "rfc8785",
    "pytest",
    "pytest-timeout",
]

[dependency-groups]
dev = [
    "hypothesis",
    "import-linter",
    "pyright",
    "ruff",
    "types-pyyaml",
]

[project.scripts]
calibration = "calibration.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/calibration"]

[tool.uv]
python-downloads = "never"
python-preference = "only-system"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
pythonpath = ["src", "tests"]
timeout = 600
markers = [
    "integration: runs real subprocesses (git, go, uv, python)",
    "go: compiles the Go builders against the product tree",
]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PL", "RUF", "N", "C4", "PT"]
ignore = ["PLR2004", "PLR0913", "PLR0917", "E501", "N818", "UP047"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR0915", "PLR0912", "PT011", "PT018", "RUF005", "PLC0415"]

[tool.importlinter]
root_package = "calibration"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "domain imports nothing from other layers"
type = "forbidden"
source_modules = ["calibration.domain"]
forbidden_modules = [
    "calibration.application",
    "calibration.adapters",
    "calibration.analysis",
    "calibration.cli",
]

[[tool.importlinter.contracts]]
name = "application imports only domain"
type = "forbidden"
source_modules = ["calibration.application"]
forbidden_modules = ["calibration.adapters", "calibration.analysis", "calibration.cli"]

[[tool.importlinter.contracts]]
name = "adapters import neither analysis nor cli"
type = "forbidden"
source_modules = ["calibration.adapters"]
forbidden_modules = ["calibration.analysis", "calibration.cli"]

[[tool.importlinter.contracts]]
name = "analysis imports only domain"
type = "forbidden"
source_modules = ["calibration.analysis"]
forbidden_modules = ["calibration.application", "calibration.adapters", "calibration.cli"]

[[tool.importlinter.contracts]]
name = "domain, application and analysis are free of I/O frameworks"
type = "forbidden"
source_modules = ["calibration.domain", "calibration.application", "calibration.analysis"]
forbidden_modules = ["subprocess", "urllib", "http", "socket"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "the harness never imports the pilot or a product package by name"
type = "forbidden"
source_modules = ["calibration"]
forbidden_modules = ["experiments"]
allow_indirect_imports = true
