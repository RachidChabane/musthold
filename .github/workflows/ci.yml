name: ci

on:
  push:
    # gate/** branches run the whole CI before a merge, without a pull request.
    branches: [main, "gate/**"]
    paths-ignore:
      - "notes/**"
      - "docs/adr/**"
  pull_request:
    paths-ignore:
      - "notes/**"
      - "docs/adr/**"
  workflow_call:
    inputs:
      modules:
        description: "Space-separated modules to lint and self-gate, as MODULES of make ci; empty runs every module and every other job"
        type: string
        default: ""
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The pytest the Python fixtures of the proof modules and the bench recordings run.
  FIXTURE_PYTEST_VERSION: "9.1.1"

permissions:
  contents: read

jobs:
  product:
    name: product modules (${{ matrix.group }}${{ matrix.shard && format(' {0} tests', matrix.shard) || '' }})
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        # The discriminating-power module's suite is too long for one job: its
        # shards (script/test-shard --list ./discpower) run in parallel, and
        # product-check traces its specs to their results. Every other module gates
        # in one job.
        include:
          - group: rest
          - group: discpower
            shard: cli
          - group: discpower
            shard: e2e
          - group: discpower
            shard: rest
    steps:
      - name: Check out musthold
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: musthold

      - name: Read the pinned Shallnot commit
        id: pin
        run: echo "sha=$(tr -d '[:space:]' < musthold/script/shallnot.pin)" >> "$GITHUB_OUTPUT"

      - name: Check out the pinned Shallnot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: RachidChabane/shallnot
          ref: ${{ steps.pin.outputs.sha }}
          path: shallnot
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: musthold/go.work
          cache-dependency-path: musthold/**/go.sum

      - name: Set up Java 21 for the JUnit 5 fixtures
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: musthold/discpower/fixtures/ecosystems/*/pom.xml

      - name: Cache the Gradle home of the JUnit 5 fixtures
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('musthold/discpower/fixtures/ecosystems/*/build.gradle*', 'musthold/discpower/fixtures/ecosystems/*/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Set up Python for the pytest fixtures
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install pytest
        run: python -m pip install --disable-pip-version-check "pytest==${FIXTURE_PYTEST_VERSION}"

      - name: Set up Node for the Jest and Vitest fixtures
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: musthold/discpower/fixtures/ecosystems/*/package-lock.json

      - name: Install the pinned Claude Code CLI for the offline plugin checks
        run: |
          claude_code_version="$(tr -d '[:space:]' < musthold/script/claude-code.pin)"
          npm install --global --no-fund --no-audit "@anthropic-ai/claude-code@${claude_code_version}"

      - name: Lint and self-gate the modules, or run their shard of tests
        working-directory: musthold
        env:
          SHALLNOT_SRC: ${{ github.workspace }}/shallnot
          MODULES: ${{ inputs.modules }}
          GROUP: ${{ matrix.group }}
          SHARD: ${{ matrix.shard }}
        run: |
          # shellcheck disable=SC2086 # MODULES is a space-separated list
          modules="$(script/module-group "$GROUP" $MODULES | tr '\n' ' ')"
          if [ -z "${modules// /}" ]; then
            echo "no module of the ${GROUP} group to gate"
            exit 0
          fi
          if [ -n "$SHARD" ]; then
            # shellcheck disable=SC2086 # modules is a space-separated list
            script/ci --shard "$SHARD" $modules
          else
            make ci MODULES="$modules"
          fi

      - name: Keep the shard's test results for product-check
        if: matrix.shard != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.group }}-${{ matrix.shard }}
          path: musthold/${{ matrix.group }}/build/test-results/go-${{ matrix.shard }}.xml
          if-no-files-found: ignore
          retention-days: 7

  product-check:
    name: product modules (discpower)
    needs: product
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out musthold
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: musthold

      - name: Read the pinned Shallnot commit
        id: pin
        run: echo "sha=$(tr -d '[:space:]' < musthold/script/shallnot.pin)" >> "$GITHUB_OUTPUT"

      - name: Check out the pinned Shallnot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: RachidChabane/shallnot
          ref: ${{ steps.pin.outputs.sha }}
          path: shallnot
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: musthold/go.work
          cache-dependency-path: musthold/**/go.sum

      - name: Gather the shards' test results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: test-results-discpower-*
          path: musthold/discpower/build/test-results
          merge-multiple: true

      - name: Lint the module and check its specs against the shards' results
        working-directory: musthold
        env:
          SHALLNOT_SRC: ${{ github.workspace }}/shallnot
          MODULES: ${{ inputs.modules }}
        run: |
          # shellcheck disable=SC2086 # MODULES is a space-separated list
          modules="$(script/module-group discpower $MODULES | tr '\n' ' ')"
          if [ -z "${modules// /}" ]; then
            echo "no module of the discpower group to check"
            exit 0
          fi
          # shellcheck disable=SC2086 # modules is a space-separated list
          script/ci --check $modules

  pilot:
    if: inputs.modules == ''
    name: pilot harness
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out musthold
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: experiments/limits-1-3/harness/.python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache: false

      - name: Install the released Shallnot the pilot pre-registration names
        run: go install github.com/RachidChabane/shallnot/cmd/shallnot@v0.4.2

      - name: Static checks of the fixture and the harness
        run: make -C experiments/limits-1-3 leak-check lint

      - name: Harness tests
        run: make -C experiments/limits-1-3 test

  bench:
    if: inputs.modules == ''
    name: benchmark core
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out musthold
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the pinned Shallnot commit
        id: pin
        run: echo "sha=$(tr -d '[:space:]' < script/shallnot.pin)" >> "$GITHUB_OUTPUT"

      - name: Check out the pinned Shallnot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: RachidChabane/shallnot
          ref: ${{ steps.pin.outputs.sha }}
          path: shallnot
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: bench/.python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache: false

      - name: Install the locked dependencies
        run: bench/script/setup

      - name: Static checks
        run: bench/script/lint

      - name: Download the Go modules the product builds against
        run: go mod download

      - name: Build the product the integration tests drive
        env:
          SHALLNOT_SRC: ${{ github.workspace }}/shallnot
          MEM_GUARD_MIN_FREE_PCT: "10"
        run: script/product-build

      - name: Install pytest for the parcel fixture the recordings drive
        run: python -m pip install --disable-pip-version-check "pytest==${FIXTURE_PYTEST_VERSION}"

      - name: Check the recorded parcel answers
        env:
          MEM_GUARD_MIN_FREE_PCT: "10"
        run: script/regen-bench-recordings --check

      - name: Tests without network
        env:
          MEM_GUARD_MIN_FREE_PCT: "10"
          UV_OFFLINE: "1"
          UV_PYTHON_DOWNLOADS: never
          GOPROXY: "off"
          GOTOOLCHAIN: local
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          NO_PROXY: "127.0.0.1,localhost,::1"
        run: bench/script/test

      - name: Build and check the results site from the synthetic fixtures
        env:
          UV_OFFLINE: "1"
        run: bench/script/site --fixtures --check

  calibration:
    if: inputs.modules == ''
    name: calibration harness
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # The frozen builders import the product by the module paths of their
      # freeze, so they compile against the product tree of the freeze tag.
      CALIBRATION_FREEZE_TAG: prereg-calibration-a1
    steps:
      - name: Check out musthold with its tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check that the study is the one its freeze tag holds
        run: git diff --exit-code "${CALIBRATION_FREEZE_TAG}" HEAD -- experiments/calibration ':!experiments/calibration/freeze'

      - name: Check out the study with the product of its freeze
        run: git checkout --quiet --detach "${CALIBRATION_FREEZE_TAG}"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: experiments/calibration/harness/.python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache: false

      - name: Install the locked dependencies
        run: experiments/calibration/script/setup

      - name: Download the Go modules the builders compile against
        run: go mod download

      - name: Static checks
        env:
          MEM_GUARD_MIN_FREE_PCT: "10"
        run: experiments/calibration/script/lint

      - name: Tests without network and without a model
        env:
          MEM_GUARD_MIN_FREE_PCT: "10"
          UV_OFFLINE: "1"
          UV_PYTHON_DOWNLOADS: never
          GOPROXY: "off"
          GOTOOLCHAIN: local
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          NO_PROXY: "127.0.0.1,localhost,::1"
        run: experiments/calibration/script/test

  demos-1:
    if: inputs.modules == ''
    name: demos-1 tooling
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out musthold
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: experiments/demos-1/harness/.python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install the locked dependencies
        run: experiments/demos-1/script/setup

      - name: Static checks
        env:
          MEM_GUARD_MIN_FREE_PCT: "10"
        run: experiments/demos-1/script/lint

      - name: Tests without network and without containers
        env:
          MEM_GUARD_MIN_FREE_PCT: "10"
          UV_OFFLINE: "1"
          UV_PYTHON_DOWNLOADS: never
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          NO_PROXY: "127.0.0.1,localhost,::1"
        run: experiments/demos-1/script/test

  notices:
    if: inputs.modules == ''
    name: third-party notices
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out musthold
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache: false

      - name: Test the generator
        run: python3 -B -m unittest discover -s script/tests

      - name: Check that the notices are current
        run: make third-party-notices-check
