name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - "notes/**"
      - "docs/adr/**"
  pull_request:
    paths-ignore:
      - "notes/**"
      - "docs/adr/**"
  workflow_call:
    inputs:
      modules:
        description: "Space-separated modules to lint and self-gate, as MODULES of make ci; empty runs every module and every other job"
        type: string
        default: ""
    secrets:
      SHALLNOT_PROOF_GATE_DEPLOY_KEY:
        required: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  product:
    name: product modules
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out spec-proof
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: spec-proof

      - name: Read the pinned Shallnot commit
        id: pin
        run: echo "sha=$(tr -d '[:space:]' < spec-proof/script/shallnot.pin)" >> "$GITHUB_OUTPUT"

      - name: Check out the pinned Shallnot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: RachidChabane/shallnot-proof-gate
          ref: ${{ steps.pin.outputs.sha }}
          ssh-key: ${{ secrets.SHALLNOT_PROOF_GATE_DEPLOY_KEY }}
          path: shallnot-proof-gate
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: spec-proof/go.work
          cache-dependency-path: spec-proof/**/go.sum

      - name: Set up Java 21 for the JUnit 5 fixtures
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: spec-proof/discpower/fixtures/ecosystems/*/pom.xml

      - name: Cache the Gradle home of the JUnit 5 fixtures
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('spec-proof/discpower/fixtures/ecosystems/*/build.gradle*', 'spec-proof/discpower/fixtures/ecosystems/*/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Set up Python for the pytest fixtures
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install pytest
        run: python -m pip install --disable-pip-version-check "pytest==9.1.1"

      - name: Set up Node for the Jest and Vitest fixtures
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: spec-proof/discpower/fixtures/ecosystems/*/package-lock.json

      - name: Lint and self-gate the modules
        working-directory: spec-proof
        env:
          SHALLNOT_SRC: ${{ github.workspace }}/shallnot-proof-gate
          MODULES: ${{ inputs.modules }}
        run: make ci MODULES="$MODULES"

  pilot:
    if: inputs.modules == ''
    name: pilot harness
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out spec-proof
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: experiments/limits-1-3/harness/.python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache: false

      - name: Install the released Shallnot the pilot pre-registration names
        run: go install github.com/RachidChabane/shallnot/cmd/shallnot@v0.4.2

      - name: Static checks of the fixture and the harness
        run: make -C experiments/limits-1-3 leak-check lint

      - name: Harness tests
        run: make -C experiments/limits-1-3 test

  bench:
    if: inputs.modules == ''
    name: benchmark core
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out spec-proof
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the pinned Shallnot commit
        id: pin
        run: echo "sha=$(tr -d '[:space:]' < script/shallnot.pin)" >> "$GITHUB_OUTPUT"

      - name: Check out the pinned Shallnot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: RachidChabane/shallnot-proof-gate
          ref: ${{ steps.pin.outputs.sha }}
          ssh-key: ${{ secrets.SHALLNOT_PROOF_GATE_DEPLOY_KEY }}
          path: shallnot-proof-gate
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: bench/.python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache: false

      - name: Install the locked dependencies
        run: bench/script/setup

      - name: Static checks
        run: bench/script/lint

      - name: Download the Go modules the product builds against
        run: go mod download

      - name: Build the product the integration tests drive
        env:
          SHALLNOT_SRC: ${{ github.workspace }}/shallnot-proof-gate
          MEM_GUARD_MIN_FREE_PCT: "10"
        run: script/product-build

      - name: Check the recorded parcel answers
        env:
          MEM_GUARD_MIN_FREE_PCT: "10"
        run: script/regen-bench-recordings --check

      - name: Tests without network
        env:
          MEM_GUARD_MIN_FREE_PCT: "10"
          UV_OFFLINE: "1"
          UV_PYTHON_DOWNLOADS: never
          GOPROXY: "off"
          GOTOOLCHAIN: local
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          NO_PROXY: "127.0.0.1,localhost,::1"
        run: bench/script/test

  calibration:
    if: inputs.modules == ''
    name: calibration harness
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out spec-proof with its tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: experiments/calibration/harness/.python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache: false

      - name: Install the locked dependencies
        run: experiments/calibration/script/setup

      - name: Download the Go modules the builders compile against
        run: go mod download

      - name: Static checks
        env:
          MEM_GUARD_MIN_FREE_PCT: "10"
        run: experiments/calibration/script/lint

      - name: Tests without network and without a model
        env:
          MEM_GUARD_MIN_FREE_PCT: "10"
          UV_OFFLINE: "1"
          UV_PYTHON_DOWNLOADS: never
          GOPROXY: "off"
          GOTOOLCHAIN: local
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          NO_PROXY: "127.0.0.1,localhost,::1"
        run: experiments/calibration/script/test

  notices:
    if: inputs.modules == ''
    name: third-party notices
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out spec-proof
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache: false

      - name: Test the generator
        run: python3 -B -m unittest discover -s script/tests

      - name: Check that the notices are current
        run: make third-party-notices-check
