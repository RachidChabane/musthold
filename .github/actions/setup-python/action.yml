name: Set up Python with uv
description: >-
  Installs uv, installs the requested Python into the job's temporary directory,
  outside uv's managed installations so that projects set to python-preference
  only-system find it on PATH, and puts first on PATH a virtual environment of it
  seeded with pip. Nothing lands in the runner's home directory.
inputs:
  python-version:
    description: The Python version to install; read from python-version-file when empty.
    required: false
    default: ""
  python-version-file:
    description: A file whose first line names the Python version.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Set up uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

    - name: Create the Python environment
      shell: bash
      env:
        PYTHON_VERSION: ${{ inputs.python-version }}
        PYTHON_VERSION_FILE: ${{ inputs.python-version-file }}
      run: |
        version="${PYTHON_VERSION}"
        if [[ -z "${version}" ]]; then
          version="$(head -n 1 "${PYTHON_VERSION_FILE}" | tr -d '[:space:]')"
        fi
        distribution="${RUNNER_TEMP}/python-dist-${version}"
        environment="${RUNNER_TEMP}/python-${version}"
        (cd "${RUNNER_TEMP}" && uv python install --install-dir "${distribution}" "${version}")
        interpreter_bin="$(find "${distribution}" -maxdepth 2 -type d -name bin -path "*cpython-*" | head -n 1)"
        (cd "${RUNNER_TEMP}" && uv venv --seed --python "${interpreter_bin}/python3" "${environment}")
        # Each GITHUB_PATH line goes before the earlier ones: the environment comes first.
        echo "${interpreter_bin}" >> "${GITHUB_PATH}"
        echo "${environment}/bin" >> "${GITHUB_PATH}"
